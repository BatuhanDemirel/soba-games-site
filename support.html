<script>
const NAV={tr:["Ana Sayfa","Gizlilik","Destek"],en:["Home","Privacy","Support"],de:["Start","Datenschutz","Support"],fr:["Accueil","Confidentialité","Assistance"]};
const S={
tr:`<h2>Destek</h2>
<p>Kahvehane ile ilgili soru, hata bildirimi veya öneriniz için bize e-posta gönderin. Genellikle 1-2 iş günü içinde yanıtlıyoruz.</p>
<div class="card" style="margin:18px 0"><b>E-posta</b><p><a href="mailto:sobagamesdestek@gmail.com">sobagamesdestek@gmail.com</a></p></div>
<h3>Sık Sorulanlar</h3>
<p><b>Oyun internetsiz çalışıyor mu?</b> Evet, tüm oyunlar tamamen çevrimdışı oynanır. İnternet yalnızca reklam gösterimi için kullanılır.</p>
<p><b>Rakipler kartlarımı görüyor mu?</b> Hayır. Yapay zekâ yalnızca açık bilgileri kullanır; kapalı kartlarınızı hiçbir zaman göremez.</p>
<p><b>İlerlemem kayboldu.</b> Oyun verileri cihazınızda saklanır; uygulamayı kaldırmak verileri siler. Sorun yaşıyorsanız cihaz modeliniz ve uygulama sürümüyle birlikte yazın.</p>
<p><b>Hata bildirirken:</b> Cihaz modeli, Android sürümü, uygulama sürümü ve hatanın hangi oyunda/ekranda olduğunu eklerseniz çok hızlı çözeriz.</p>`,
en:`<h2>Support</h2>
<p>For questions, bug reports or suggestions about Kahvehane, send us an email. We usually reply within 1–2 business days.</p>
<div class="card" style="margin:18px 0"><b>Email</b><p><a href="mailto:sobagamesdestek@gmail.com">sobagamesdestek@gmail.com</a></p></div>
<h3>FAQ</h3>
<p><b>Does the game work offline?</b> Yes, all games are fully playable offline. Internet is used only to show ads.</p>
<p><b>Can opponents see my cards?</b> No. The AI only uses public information; it can never see your hidden cards.</p>
<p><b>I lost my progress.</b> Game data is stored on your device; uninstalling the app deletes it. If something looks wrong, write to us with your device model and app version.</p>
<p><b>Reporting a bug:</b> Please include your device model, Android version, app version and the game/screen where it happened.</p>`,
de:`<h2>Support</h2>
<p>Bei Fragen, Fehlermeldungen oder Vorschlägen zu Kahvehane schreiben Sie uns eine E-Mail. Wir antworten in der Regel innerhalb von 1–2 Werktagen.</p>
<div class="card" style="margin:18px 0"><b>E-Mail</b><p><a href="mailto:sobagamesdestek@gmail.com">sobagamesdestek@gmail.com</a></p></div>
<h3>Häufige Fragen</h3>
<p><b>Funktioniert das Spiel offline?</b> Ja, alle Spiele sind vollständig offline spielbar. Internet wird nur für Werbung genutzt.</p>
<p><b>Sehen die Gegner meine Karten?</b> Nein. Die KI nutzt nur offene Informationen; Ihre verdeckten Karten sieht sie nie.</p>
<p><b>Mein Spielstand ist weg.</b> Spieldaten liegen auf Ihrem Gerät; das Deinstallieren der App löscht sie. Bei Problemen schreiben Sie uns mit Gerätemodell und App-Version.</p>
<p><b>Fehler melden:</b> Bitte Gerätemodell, Android-Version, App-Version und das betroffene Spiel/den Bildschirm angeben.</p>`,
fr:`<h2>Assistance</h2>
<p>Pour toute question, signalement de bug ou suggestion concernant Kahvehane, envoyez-nous un e-mail. Nous répondons généralement sous 1 à 2 jours ouvrés.</p>
<div class="card" style="margin:18px 0"><b>E-mail</b><p><a href="mailto:sobagamesdestek@gmail.com">sobagamesdestek@gmail.com</a></p></div>
<h3>Questions fréquentes</h3>
<p><b>Le jeu fonctionne-t-il hors ligne ?</b> Oui, tous les jeux sont entièrement jouables hors ligne. Internet ne sert qu'à afficher la publicité.</p>
<p><b>Les adversaires voient-ils mes cartes ?</b> Non. L'IA n'utilise que les informations visibles ; elle ne voit jamais vos cartes cachées.</p>
<p><b>J'ai perdu ma progression.</b> Les données de jeu sont stockées sur votre appareil ; désinstaller l'application les supprime. En cas de problème, écrivez-nous avec le modèle de votre appareil et la version de l'application.</p>
<p><b>Signaler un bug :</b> merci d'indiquer le modèle d'appareil, la version d'Android, la version de l'application et le jeu/écran concerné.</p>`
};
function setLang(l){
  if(!S[l])l="tr";
  try{localStorage.setItem("soba_lang",l)}catch(e){}
  document.documentElement.lang=l;
  document.getElementById("content").innerHTML=S[l];
  const n=NAV[l];
  document.getElementById("n_home").textContent=n[0];
  document.getElementById("n_priv").textContent=n[1];
  document.getElementById("n_sup").textContent=n[2];
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.getAttribute("data-lang")===l));
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.getAttribute("data-lang"))));
let saved=null;try{saved=localStorage.getItem("soba_lang")}catch(e){}
setLang(saved||((navigator.language||"tr").slice(0,2)));
</script>
</body>
</html>

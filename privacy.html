const P={
tr:`<h2>Gizlilik Politikası</h2>
<p class="updated">Son güncelleme: 24 Ağustos 2026 · Uygulama: <b>Kahvehane: Türk Kahvehane Oyunları</b> (com.kahvehane.oyunlari) · Geliştirici: SoBa</p>
<h3>Özet</h3>
<p>Kahvehane tamamen çevrimdışı çalışan bir kart oyunudur. Hesap açılmaz, kayıt istenmez; oyun ilerlemeniz ve ayarlarınız yalnızca kendi cihazınızda saklanır. Uygulamanın kendisi kişisel veri toplamaz ve sunucularımıza hiçbir veri göndermez.</p>
<h3>Reklamlar (Google AdMob)</h3>
<p>Uygulama, Google AdMob aracılığıyla reklam gösterir. AdMob, reklam sunmak ve sahtekârlığı önlemek için cihaz tanımlayıcıları (ör. reklam kimliği), IP adresi ve genel cihaz bilgileri gibi verileri işleyebilir. Bu işleme Google'ın kontrolündedir; ayrıntılar için <a href="https://policies.google.com/privacy" rel="noopener">Google Gizlilik Politikası</a> ve <a href="https://support.google.com/admob/answer/6128543" rel="noopener">AdMob veri kullanımı</a> sayfalarına bakın. Cihaz ayarlarınızdan reklam kimliğinizi sıfırlayabilir veya kişiselleştirilmiş reklamları kapatabilirsiniz.</p>
<h3>Uygulama İçi Satın Almalar</h3>
<p>Satın almalar Google Play Faturalandırma üzerinden yapılır. Ödeme bilgileriniz bize hiçbir zaman iletilmez; tamamı Google tarafından işlenir.</p>
<h3>Çocuklar</h3>
<p>Uygulama genel kitleye yöneliktir ve çocuklara özel olarak hedeflenmemiştir. Uygulama bilerek çocuklardan kişisel veri toplamaz.</p>
<h3>Veri Silme</h3>
<p>Tüm oyun verileri cihazınızdadır; uygulamayı kaldırdığınızda veya uygulama verilerini temizlediğinizde silinir.</p>
<h3>Değişiklikler ve İletişim</h3>
<p>Bu politika güncellenirse yeni sürüm bu sayfada yayımlanır. Sorularınız için: <a href="support.html">Destek sayfası</a> veya <a href="mailto:batuhand@gmail.com">batuhand@gmail.com</a>.</p>`,
en:`<h2>Privacy Policy</h2>
<p class="updated">Last updated: August 24, 2026 · App: <b>Kahvehane: Turkish Coffeehouse Games</b> (com.kahvehane.oyunlari) · Developer: SoBa</p>
<h3>Summary</h3>
<p>Kahvehane is a fully offline card game. No account or registration is required; your game progress and settings are stored only on your own device. The app itself does not collect personal data and sends nothing to our servers.</p>
<h3>Advertising (Google AdMob)</h3>
<p>The app shows ads via Google AdMob. AdMob may process data such as device identifiers (e.g. the advertising ID), IP address and general device information to serve ads and prevent fraud. This processing is controlled by Google — see the <a href="https://policies.google.com/privacy" rel="noopener">Google Privacy Policy</a> and <a href="https://support.google.com/admob/answer/6128543" rel="noopener">AdMob data usage</a>. You can reset your advertising ID or opt out of personalized ads in your device settings.</p>
<h3>In-App Purchases</h3>
<p>Purchases are handled by Google Play Billing. Your payment details never reach us; they are processed entirely by Google.</p>
<h3>Children</h3>
<p>The app is intended for a general audience and is not directed specifically at children. It does not knowingly collect personal data from children.</p>
<h3>Data Deletion</h3>
<p>All game data lives on your device and is removed when you uninstall the app or clear its data.</p>
<h3>Changes & Contact</h3>
<p>Updates to this policy will be published on this page. Questions: <a href="support.html">Support page</a> or <a href="mailto:batuhand@gmail.com">batuhand@gmail.com</a>.</p>`,
de:`<h2>Datenschutzerklärung</h2>
<p class="updated">Stand: 24. August 2026 · App: <b>Kahvehane</b> (com.kahvehane.oyunlari) · Entwickler: SoBa</p>
<h3>Zusammenfassung</h3>
<p>Kahvehane ist ein vollständig offline spielbares Kartenspiel. Es ist kein Konto erforderlich; Spielstände und Einstellungen werden nur auf Ihrem Gerät gespeichert. Die App selbst erhebt keine personenbezogenen Daten und sendet nichts an unsere Server.</p>
<h3>Werbung (Google AdMob)</h3>
<p>Die App zeigt Werbung über Google AdMob. AdMob kann Daten wie Gerätekennungen (z. B. die Werbe-ID), IP-Adresse und allgemeine Geräteinformationen verarbeiten, um Anzeigen auszuliefern und Betrug zu verhindern. Diese Verarbeitung liegt bei Google — siehe <a href="https://policies.google.com/privacy" rel="noopener">Google-Datenschutzerklärung</a> und <a href="https://support.google.com/admob/answer/6128543" rel="noopener">AdMob-Datennutzung</a>. Sie können Ihre Werbe-ID in den Geräteeinstellungen zurücksetzen oder personalisierte Werbung deaktivieren.</p>
<h3>In-App-Käufe</h3>
<p>Käufe laufen über Google Play Billing. Ihre Zahlungsdaten erreichen uns nie; sie werden vollständig von Google verarbeitet.</p>
<h3>Kinder</h3>
<p>Die App richtet sich an ein allgemeines Publikum und nicht gezielt an Kinder. Sie erhebt wissentlich keine Daten von Kindern.</p>
<h3>Datenlöschung</h3>
<p>Alle Spieldaten liegen auf Ihrem Gerät und werden beim Deinstallieren der App oder Löschen der App-Daten entfernt.</p>
<h3>Änderungen & Kontakt</h3>
<p>Aktualisierungen dieser Erklärung werden auf dieser Seite veröffentlicht. Fragen: <a href="support.html">Support</a> oder <a href="mailto:batuhand@gmail.com">batuhand@gmail.com</a>.</p>`,
fr:`<h2>Politique de confidentialité</h2>
<p class="updated">Dernière mise à jour : 24 août 2026 · Application : <b>Kahvehane</b> (com.kahvehane.oyunlari) · Développeur : SoBa</p>
<h3>Résumé</h3>
<p>Kahvehane est un jeu de cartes entièrement hors ligne. Aucun compte n'est requis ; votre progression et vos réglages sont stockés uniquement sur votre appareil. L'application elle-même ne collecte aucune donnée personnelle et n'envoie rien à nos serveurs.</p>
<h3>Publicité (Google AdMob)</h3>
<p>L'application affiche des publicités via Google AdMob. AdMob peut traiter des données telles que les identifiants d'appareil (p. ex. l'identifiant publicitaire), l'adresse IP et des informations générales sur l'appareil afin de diffuser des annonces et de prévenir la fraude. Ce traitement est contrôlé par Google — voir la <a href="https://policies.google.com/privacy" rel="noopener">politique de confidentialité de Google</a> et <a href="https://support.google.com/admob/answer/6128543" rel="noopener">l'utilisation des données AdMob</a>. Vous pouvez réinitialiser votre identifiant publicitaire ou désactiver les annonces personnalisées dans les réglages de votre appareil.</p>
<h3>Achats intégrés</h3>
<p>Les achats passent par Google Play Billing. Vos informations de paiement ne nous parviennent jamais ; elles sont traitées entièrement par Google.</p>
<h3>Enfants</h3>
<p>L'application s'adresse à un public général et ne cible pas spécifiquement les enfants. Elle ne collecte pas sciemment de données auprès d'enfants.</p>
<h3>Suppression des données</h3>
<p>Toutes les données de jeu résident sur votre appareil et sont supprimées lors de la désinstallation de l'application ou de l'effacement de ses données.</p>
<h3>Modifications & contact</h3>
<p>Les mises à jour de cette politique seront publiées sur cette page. Questions : <a href="support.html">page d'assistance</a> ou <a href="mailto:batuhand@gmail.com">batuhand@gmail.com</a>.</p>`
};
function setLang(l){
  if(!P[l])l="tr";
  try{localStorage.setItem("soba_lang",l)}catch(e){}
  document.documentElement.lang=l;
  document.getElementById("content").innerHTML=P[l];
  const n=NAV[l];
  document.getElementById("n_home").textContent=n[0];
  document.getElementById("n_priv").textContent=n[1];
  document.getElementById("n_sup").textContent=n[2];
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.getAttribute("data-lang")===l));
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>setLang(b.getAttribute("data-lang"))));
let saved=null;try{saved=localStorage.getItem("soba_lang")}catch(e){}
setLang(saved||((navigator.language||"tr").slice(0,2)));
</script>
